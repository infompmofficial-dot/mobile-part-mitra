<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏪 WHOLESALER PANEL — Mobile Part Mitra (MPM)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --or:#F47B20;--or2:rgba(244,123,32,0.13);--or3:rgba(244,123,32,0.07);--orB:rgba(244,123,32,0.28);
  --bg:#0A0A0A;--bg2:#111111;--bg3:#181818;--bg4:#202020;
  --bd:rgba(255,255,255,0.06);--bd2:rgba(255,255,255,0.10);
  --tx:#F2EDE8;--tx2:#A89E96;--tx3:#5A534E;
  --gr:#3DBB78;--re:#E05555;--am:#F4B420;
}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--tx);min-height:100vh;padding:28px 20px 60px;display:flex;flex-direction:column;align-items:center;gap:32px;}

/* ── HEADER ── */
.hdr{width:100%;max-width:900px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.hdr-left{display:flex;align-items:center;gap:12px;}
.logo{width:42px;height:42px;background:var(--or2);border:1.5px solid var(--orB);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hdr-title{font-size:18px;font-weight:800;letter-spacing:-0.3px;}
.hdr-sub{font-size:11px;color:var(--tx3);margin-top:1px;}
.badge{background:var(--or2);border:1px solid var(--orB);color:var(--or);font-size:9px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase;}

/* ── PROGRESS RAIL ── */
.progress-wrap{width:100%;max-width:900px;}
.progress-rail{display:flex;align-items:center;gap:0;position:relative;}
.step-node{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;cursor:pointer;}
.step-node:last-child{flex:0;}
.node-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;transition:all .3s;position:relative;z-index:2;flex-shrink:0;}
.node-circle.done{background:var(--or);color:#fff;box-shadow:0 0 16px rgba(244,123,32,0.4);}
.node-circle.active{background:var(--or2);border:2px solid var(--or);color:var(--or);}
.node-circle.idle{background:var(--bg3);border:1.5px solid var(--bd2);color:var(--tx3);}
.node-label{font-size:8.5px;color:var(--tx3);margin-top:6px;text-align:center;max-width:64px;line-height:1.3;font-weight:500;}
.node-label.active-lbl{color:var(--or);font-weight:700;}
.step-line{flex:1;height:2px;background:var(--bd2);margin-top:-18px;position:relative;z-index:1;transition:background .4s;}
.step-line.filled{background:var(--or);}

/* ── MAIN LAYOUT ── */
.main{width:100%;max-width:900px;display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;}
@media(max-width:700px){.main{grid-template-columns:1fr;}}

/* ── STEP CARD ── */
.step-card{background:var(--bg2);border:1px solid var(--bd2);border-radius:20px;overflow:hidden;}
.step-card-top{padding:20px 22px 16px;border-bottom:1px solid var(--bd);}
.step-num{font-size:10px;color:var(--or);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;}
.step-title{font-size:20px;font-weight:900;letter-spacing:-0.4px;margin-bottom:4px;}
.step-desc{font-size:12px;color:var(--tx2);line-height:1.5;}
.step-body{padding:20px 22px;}

/* ── PHONE ── */
.phone-wrap{position:sticky;top:20px;}
.phone{background:var(--bg);border-radius:40px;border:2px solid rgba(255,255,255,0.07);overflow:hidden;box-shadow:0 0 0 5px rgba(0,0,0,0.5),0 0 0 6px rgba(255,255,255,0.03),0 30px 80px rgba(244,123,32,0.12),0 0 50px rgba(244,123,32,0.05);}
.notch{width:80px;height:22px;background:var(--bg);border:1.5px solid rgba(255,255,255,0.04);border-top:none;border-radius:0 0 14px 14px;margin:0 auto;}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 18px;font-size:9px;font-weight:600;color:var(--tx3);}
.screen-content{padding:14px 13px 20px;min-height:520px;}

/* ── FORM ELEMENTS ── */
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;color:var(--tx3);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:5px;}
.req{color:var(--or);}
.mock-input{background:var(--bg3);border:1px solid var(--bd2);border-radius:11px;padding:10px 12px;font-size:12px;color:var(--tx);display:flex;align-items:center;gap:8px;transition:border-color .25s;}
.mock-input.filled{border-color:rgba(244,123,32,0.35);background:rgba(244,123,32,0.05);}
.mock-input.active-field{border-color:var(--or);box-shadow:0 0 0 3px rgba(244,123,32,0.1);animation:pulse-border 1.5s ease-in-out infinite;}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 3px rgba(244,123,32,0.1);}50%{box-shadow:0 0 0 5px rgba(244,123,32,0.18);}}
.mock-val{color:var(--or);font-weight:600;}
.mock-ph{color:var(--tx3);}
.mock-select{display:flex;justify-content:space-between;align-items:center;}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px;}
.cat-opt{background:var(--bg3);border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;text-align:center;cursor:pointer;transition:all .2s;}
.cat-opt.chosen{background:var(--or2);border-color:var(--or);}
.cat-opt-icon{font-size:18px;margin-bottom:3px;}
.cat-opt-name{font-size:9px;font-weight:700;color:var(--tx2);}
.cat-opt.chosen .cat-opt-name{color:var(--or);}
.price-stock-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mock-btn{background:var(--or);border-radius:12px;padding:12px;text-align:center;color:#fff;font-size:12px;font-weight:700;margin-top:4px;}
.mock-btn.disabled{background:var(--bg4);color:var(--tx3);}
.success-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:460px;text-align:center;gap:10px;}
.success-icon{width:68px;height:68px;background:rgba(61,187,120,0.12);border:2px solid rgba(61,187,120,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:4px;}

/* ── STEP CONTENT ── */
.info-row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.info-icon{width:32px;height:32px;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.info-text{font-size:12px;color:var(--tx2);line-height:1.5;}
.info-text strong{color:var(--tx);font-weight:600;}
.tag{display:inline-flex;align-items:center;background:var(--bg3);border:1px solid var(--bd2);color:var(--tx2);font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500;}
.tag-or{background:var(--or2);border-color:var(--orB);color:var(--or);}
.tip-box{background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin-top:12px;}
.tip-title{font-size:10px;font-weight:700;color:var(--or);margin-bottom:7px;display:flex;align-items:center;gap:5px;}
.tip-item{font-size:11px;color:var(--tx2);margin-bottom:5px;padding-left:12px;border-left:2px solid var(--orB);line-height:1.45;}

/* ── NAV BTNS ── */
.nav-btns{display:flex;gap:10px;margin-top:20px;}
.btn-prev{flex:1;background:var(--bg3);border:1px solid var(--bd2);color:var(--tx2);padding:12px;border-radius:13px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans';transition:all .2s;}
.btn-next{flex:2;background:var(--or);border:none;color:#fff;padding:12px;border-radius:13px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans';transition:opacity .2s;}
.btn-next:disabled{opacity:0.35;cursor:not-allowed;}
.btn-prev:hover{border-color:var(--bd2);}

/* ── CHECKLIST ── */
.checklist{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.check-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--bd);border-radius:11px;transition:all .3s;}
.check-item.checked{background:rgba(61,187,120,0.06);border-color:rgba(61,187,120,0.2);}
.check-box{width:20px;height:20px;border-radius:6px;background:var(--bg4);border:1.5px solid var(--bd2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all .3s;}
.check-item.checked .check-box{background:rgba(61,187,120,0.15);border-color:rgba(61,187,120,0.4);color:#3DBB78;}
.check-label{font-size:12px;color:var(--tx2);}
.check-item.checked .check-label{color:var(--tx);}

/* ── INVENTORY PREVIEW ── */
.inv-card{background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.inv-card.new-glow{border-color:var(--orB);background:var(--or3);animation:glow-in .5s ease;}
@keyframes glow-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
.inv-name{font-size:11px;font-weight:700;}
.inv-meta{font-size:9px;color:var(--tx3);margin-top:2px;}
.pill{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;}
.pill-gr{background:rgba(61,187,120,0.12);color:#3DBB78;border:1px solid rgba(61,187,120,0.25);}
.pill-or{background:var(--or2);color:var(--or);border:1px solid var(--orB);}

/* ── STEP INDICATOR TIMELINE ── */
.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;}
.tl-left{display:flex;flex-direction:column;align-items:center;}
.tl-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:all .3s;}
.tl-dot.done{background:var(--or);color:#fff;}
.tl-dot.cur{background:var(--or2);border:2px solid var(--or);color:var(--or);}
.tl-dot.up{background:var(--bg3);border:1.5px solid var(--bd);color:var(--tx3);}
.tl-line{width:2px;flex:1;min-height:18px;background:var(--bd);}
.tl-line.done{background:var(--or);}
.tl-right{padding-bottom:18px;}
.tl-title{font-size:12px;font-weight:600;margin-bottom:2px;}
.tl-sub{font-size:10px;color:var(--tx3);}

/* ── ANIM ── */
.fade-in{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-left">
    <div class="logo">⚙️</div>
    <div>
      <div class="hdr-title">Wholesaler Panel — Product Add</div>
      <div class="hdr-sub">Step-by-step workflow guide</div>
    </div>
  </div>
  <div class="badge">🏪 Wholesaler View</div>
</div>

<!-- PROGRESS RAIL -->
<div class="progress-wrap">
  <div class="progress-rail" id="progress-rail">
    <!-- Injected by JS -->
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT: Step Content -->
  <div class="step-card" id="step-card">
    <!-- Injected by JS -->
  </div>

  <!-- RIGHT: Phone Preview -->
  <div class="phone-wrap">
    <div style="font-size:9px;color:var(--tx3);text-align:center;margin-bottom:8px;letter-spacing:0.08em;text-transform:uppercase;">📱 App Screen Preview</div>
    <div class="phone">
      <div class="notch"></div>
      <div class="status-bar">
        <span>9:41</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <svg width="13" height="9" viewBox="0 0 14 10" fill="#5A534E"><path d="M7 1.5C9.4 1.5 11.5 2.7 12.8 4.5L14 3.2C12.3 1.2 9.8 0 7 0S1.7 1.2 0 3.2L1.2 4.5C2.5 2.7 4.6 1.5 7 1.5Z"/><path d="M7 4C8.6 4 10 4.7 11 5.8L12.2 4.5C10.9 3.1 9 2.3 7 2.3S3.1 3.1 1.8 4.5L3 5.8C4 4.7 5.4 4 7 4Z"/><circle cx="7" cy="8" r="1.5"/></svg>
          <svg width="20" height="9" viewBox="0 0 22 10" fill="none"><rect x="0" y="1" width="18" height="8" rx="2" stroke="#5A534E" stroke-width="1"/><rect x="19" y="3" width="2" height="4" rx="1" fill="#5A534E"/><rect x="1.5" y="2.5" width="11" height="5" rx="1" fill="#F47B20"/></svg>
        </div>
      </div>
      <div class="screen-content" id="phone-screen">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

</div>

<script>
const steps = [
  {
    id: 'dashboard',
    label: 'Dashboard',
    emoji: '🏠',
    title: 'Wholesaler Dashboard Kholo',
    desc: 'Login karne ke baad seedha wholesaler dashboard dikhega — yahan se saari cheezein manage hoti hain.',
    phone: phoneDashboard,
    content: contentDashboard
  },
  {
    id: 'tap-add',
    label: '+ Add Part',
    emoji: '➕',
    title: '"+ Add Part" Button Dabao',
    desc: 'Dashboard ke top right corner mein orange "Add Part" button hai. Usse tap karo.',
    phone: phoneTapAdd,
    content: contentTapAdd
  },
  {
    id: 'basic',
    label: 'Basic Info',
    emoji: '📝',
    title: 'Basic Information Bharo',
    desc: 'Part ka naam, brand aur mobile model number fill karo. Jitna detail utna better search result.',
    phone: phoneBasicInfo,
    content: contentBasicInfo
  },
  {
    id: 'category',
    label: 'Category',
    emoji: '📦',
    title: 'Category Select Karo',
    desc: 'Part ki sahi category chunna zaroori hai — isse retailer ka search filter kaam karta hai.',
    phone: phoneCategory,
    content: contentCategory
  },
  {
    id: 'price',
    label: 'Price & Stock',
    emoji: '💰',
    title: 'Price aur Stock Set Karo',
    desc: 'Price (₹) aur kitne pieces available hain woh daalo. Stock 0 hone pe part auto-hide ho jaata hai.',
    phone: phonePrice,
    content: contentPrice
  },
  {
    id: 'review',
    label: 'Review',
    emoji: '👁',
    title: 'Review karke Submit Karo',
    desc: 'Sab kuch ek baar check karo — phir "Part Add Karo" press karne pe live ho jaata hai.',
    phone: phoneReview,
    content: contentReview
  },
  {
    id: 'live',
    label: 'Live! ✅',
    emoji: '🚀',
    title: 'Part Live Ho Gaya!',
    desc: 'Aapka part ab sabhi retailers ko search mein dikhai dega. Inventory mein bhi add ho gaya.',
    phone: phoneLive,
    content: contentLive
  }
];

let cur = 0;

// ──────────── PHONE SCREENS ────────────

function phoneDashboard() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div><div style="font-size:10px;color:var(--tx3);">🏪 Wholesaler</div><div style="font-size:14px;font-weight:800;">Sharma Electronics</div></div>
      <div style="width:30px;height:30px;background:var(--bg3);border:1px solid var(--bd);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;">🚪</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:16px;">
      <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:9px;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--or);">12</div><div style="font-size:8px;color:var(--tx3);">Parts</div></div>
      <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:9px;text-align:center;"><div style="font-size:16px;font-weight:800;color:#F4B420;">3</div><div style="font-size:8px;color:var(--tx3);">Pending</div></div>
      <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:9px;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--gr);">47</div><div style="font-size:8px;color:var(--tx3);">Done</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-size:11px;font-weight:700;">Meri Inventory</div>
      <div style="font-size:10px;color:var(--or);font-weight:600;">+ Add Part</div>
    </div>
    ${['Samsung A54 Screen','Redmi 12 Battery','iPhone 14 Charging Port'].map(n=>`
    <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-size:10px;font-weight:600;">${n}</div><div style="font-size:8px;color:var(--tx3);">Active · Stock: ${Math.floor(Math.random()*15+2)}</div></div>
      <span style="background:rgba(61,187,120,0.1);color:#3DBB78;border:1px solid rgba(61,187,120,0.2);font-size:7.5px;font-weight:700;padding:2px 6px;border-radius:10px;">👁 Live</span>
    </div>`).join('')}`;
}

function phoneTapAdd() {
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div><div style="font-size:10px;color:var(--tx3);">🏪 Wholesaler</div><div style="font-size:14px;font-weight:800;">Sharma Electronics</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:16px;">
      <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:9px;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--or);">12</div><div style="font-size:8px;color:var(--tx3);">Parts</div></div>
      <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:9px;text-align:center;"><div style="font-size:16px;font-weight:800;color:#F4B420;">3</div><div style="font-size:8px;color:var(--tx3);">Pending</div></div>
      <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:9px;text-align:center;"><div style="font-size:16px;font-weight:800;color:var(--gr);">47</div><div style="font-size:8px;color:var(--tx3);">Done</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-size:11px;font-weight:700;">Meri Inventory</div>
      <div style="background:var(--or);color:#fff;font-size:10px;font-weight:700;padding:6px 12px;border-radius:20px;animation:pulse-btn 1s ease-in-out infinite;box-shadow:0 0 16px rgba(244,123,32,0.5);">✚ Add Part</div>
    </div>
    <div style="background:rgba(244,123,32,0.05);border:1.5px dashed var(--orB);border-radius:12px;padding:20px;text-align:center;margin-top:8px;">
      <div style="font-size:24px;margin-bottom:6px;">👆</div>
      <div style="font-size:11px;color:var(--or);font-weight:600;">Yahan tap karo</div>
      <div style="font-size:9px;color:var(--tx3);margin-top:3px;">Add Part button dabao</div>
    </div>
    <style>@keyframes pulse-btn{0%,100%{box-shadow:0 0 16px rgba(244,123,32,0.4);}50%{box-shadow:0 0 24px rgba(244,123,32,0.7);}}</style>`;
}

function phoneBasicInfo() {
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bd);">
      <div style="width:26px;height:26px;background:var(--bg3);border:1px solid var(--bd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;">←</div>
      <div style="font-size:13px;font-weight:700;">Naya Part Add Karo</div>
    </div>
    <div class="form-group">
      <div class="form-label">Part Name <span class="req">*</span></div>
      <div class="mock-input active-field"><span class="mock-val">Samsung A54 Screen OLED|</span></div>
    </div>
    <div class="form-group">
      <div class="form-label">Brand</div>
      <div class="mock-input filled"><span class="mock-val">Samsung</span></div>
    </div>
    <div class="form-group">
      <div class="form-label">Mobile Model</div>
      <div class="mock-input"><span class="mock-ph">A54, Note 12, C55...</span></div>
    </div>`;
}

function phoneCategory() {
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bd);">
      <div style="width:26px;height:26px;background:var(--bg3);border:1px solid var(--bd);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;">←</div>
      <div style="font-size:13px;font-weight:700;">Naya Part Add Karo</div>
    </div>
    <div class="form-group">
      <div class="form-label">Category <span class="req">*</span></div>

// ──────────── HELPERS ────────────

function tlItem(state, num, title, sub, extra='', isLast=false) {
  return `
    <div class="tl-item">
      <div class="tl-left">
        <div class="tl-dot ${state}">${state==='done'?'✓':num}</div>
        ${!isLast?`<div class="tl-line ${state==='done'?'done':''}"></div>`:''}
      </div>
      <div class="tl-right">
        <div class="tl-title">${title}</div>
        <div class="tl-sub">${sub}</div>
      </div>
    </div>`;
}

function buildProgressRail() {
  const rail = document.getElementById('progress-rail');
  let html = '';
  steps.forEach((s, i) => {
    const state = i < cur ? 'done' : i === cur ? 'active' : 'idle';
    html += `<div class="step-node" onclick="goTo(${i})">
      <div class="node-circle ${state}">${state==='done'?'✓':s.emoji}</div>
      <div class="node-label ${i===cur?'active-lbl':''}">${s.label}</div>
    </div>`;
    if (i < steps.length - 1) {
      html += `<div class="step-line ${i < cur ? 'filled' : ''}"></div>`;
    }
  });
  rail.innerHTML = html;
}

function render() {
  buildProgressRail();
  const s = steps[cur];
  document.getElementById('step-card').innerHTML = s.content();
  document.getElementById('phone-screen').innerHTML = s.phone();
  document.getElementById('step-card').classList.remove('fade-in');
  void document.getElementById('step-card').offsetWidth;
  document.getElementById('step-card').classList.add('fade-in');
  document.getElementById('phone-screen').classList.remove('fade-in');
  void document.getElementById('phone-screen').offsetWidth;
  document.getElementById('phone-screen').classList.add('fade-in');
}

function next() { if (cur < steps.length - 1) { cur++; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function prev() { if (cur > 0) { cur--; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function goTo(i) { cur = i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function restart() { cur = 0; render(); window.scrollTo({top:0,behavior:'smooth'}); }

render();

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});
</script>
